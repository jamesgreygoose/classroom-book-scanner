<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Classroom Book Library</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
    }

    #home {
      max-width: 650px;
      margin: auto;
    }

    .logo {
      width: 90%;
      max-width: 500px;
      max-height: 180px;
      object-fit: contain;
      margin: 10px auto 20px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0 30px;
      color: #333;
    }

    button {
      width: 90%;
      max-width: 550px;
      padding: 28px;
      margin: 10px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 18px;
      cursor: pointer;
    }

    .borrow {
      background: #4caf50;
      color: white;
    }

    .return {
      background: #2196f3;
      color: white;
    }

    .mybooks {
      background: #8e44ad;
      color: white;
    }

    .back {
      background: #777;
      color: white;
      font-size: 20px;
      padding: 15px;
    }

    /* =========================
       ORIGINAL SCANNER SIZE
    ========================= */

#reader {
  width: 100%;
  max-width: 600px;
  margin: 10px auto;
}

    #message {
      font-size: 24px;
      font-weight: bold;
      margin: 25px auto;
      max-width: 600px;
    }

    .success {
      color: #16803c;
    }

    .warning {
      color: #c77700;
    }

    .error {
      color: #c62828;
    }

    .small {
      font-size: 18px;
      color: #555;
      margin: 8px auto;
    }

    /* =========================
       MANUAL ISBN
    ========================= */

    #manualIsbn {
      display: none;
      max-width: 560px;
      margin: 5px auto 10px;
      background: white;
      padding: 10px 15px 12px;
      border-radius: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    }

    #manualIsbn p {
      font-size: 18px;
      font-weight: bold;
      margin: 2px 0 8px;
      color: #333;
    }

    #isbnInput {
      width: 75%;
      max-width: 420px;
      box-sizing: border-box;
      padding: 10px;
      font-size: 21px;
      text-align: center;
      border: 2px solid #bbb;
      border-radius: 10px;
    }

    #isbnButton {
      background: #ff9800;
      color: white;
      width: 75%;
      max-width: 420px;
      padding: 13px;
      font-size: 21px;
      margin: 8px 0 0;
    }

    /* =========================
       MY BOOKS
    ========================= */

    .book-list {
      text-align: left;
      max-width: 550px;
      margin: 20px auto;
    }

    .book {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    }

    .book-title {
      font-size: 23px;
      font-weight: bold;
      color: #333;
    }

    .book-isbn {
      font-size: 14px;
      color: #777;
      margin-top: 6px;
    }

  </style>

</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

  <img
    class="logo"
    src="https://www.wellesbourneceprimary.co.uk/wp-content/uploads/2021/09/cropped-wceps-logo.png"
    alt="School logo">

  <h1>📚 Classroom Book Library</h1>

  <button
    class="borrow"
    onclick="startProcess('borrow')">
    📖 BORROW A BOOK
  </button>

  <button
    class="return"
    onclick="startProcess('return')">
    ↩️ RETURN A BOOK
  </button>

  <button
    class="mybooks"
    onclick="startMyBooks()">
    📚 MY BOOKS
  </button>

</div>


<!-- =========================
     SCANNER
========================= -->

<div id="scanner" style="display:none;">

  <h2 id="instruction">
    Scan your pupil code
  </h2>

  <div id="reader"></div>


  <!-- =========================
       MANUAL ISBN ENTRY
  ========================= -->

  <div id="manualIsbn">

    <p>
      Or enter the ISBN manually:
    </p>

    <input
      id="isbnInput"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter ISBN">

    <br>

    <button
      id="isbnButton"
      onclick="useManualIsbn()">
      📚 USE ISBN
    </button>

  </div>

  <button
    class="back"
    onclick="stopScanner()">
    ← Cancel
  </button>

</div>


<!-- =========================
     MY BOOKS
========================= -->

<div id="myBooksScreen" style="display:none;">

  <h2 id="myBooksTitle">
    📚 My Books
  </h2>

  <div id="bookList"
       class="book-list">
  </div>

  <button
    class="back"
    onclick="resetApp()">
    ← Back
  </button>

</div>


<div id="message"></div>


<script>

let scanner = null;
let action = null;
let pupilCode = null;
let scanningPupil = false;
let scanningBook = false;
let scanningMyBooks = false;


/* =================================================
   BORROW / RETURN
================================================= */

function startProcess(selectedAction) {

  action = selectedAction;
  pupilCode = null;

  document.getElementById('home').style.display = 'none';

  document.getElementById('scanner').style.display = 'block';

  document.getElementById('myBooksScreen').style.display = 'none';

  document.getElementById('manualIsbn').style.display = 'none';

  document.getElementById('isbnInput').value = '';

  document.getElementById('instruction').innerText =
    '👤 Scan your pupil code';

  scanningPupil = true;
  scanningBook = false;
  scanningMyBooks = false;

  startScanner();
}


/* =================================================
   MY BOOKS
================================================= */

function startMyBooks() {

  pupilCode = null;

  document.getElementById('home').style.display = 'none';

  document.getElementById('scanner').style.display = 'block';

  document.getElementById('myBooksScreen').style.display = 'none';

  document.getElementById('manualIsbn').style.display = 'none';

  document.getElementById('instruction').innerText =
    '👤 Scan your pupil code';

  scanningPupil = false;
  scanningBook = false;
  scanningMyBooks = true;

  startScanner();
}


/* =================================================
   CAMERA
================================================= */

function startScanner() {

  if (scanner) {

    try {
      scanner.clear();
    } catch(e) {}

  }

  scanner = new Html5Qrcode("reader");

  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 180
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128

      ]
    },

    onScanSuccess,

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  ).catch(function(error) {

    showError(
      'I could not start the camera. ' +
      'Please make sure Chrome has permission to use the camera.'
    );

  });
}


/* =================================================
   SCAN RESULT
================================================= */

function onScanSuccess(decodedText) {

  /* -------------------------
     MY BOOKS 
  ------------------------- */

  if (scanningMyBooks) {

    pupilCode = decodedText.trim();

    scanningMyBooks = false;

    stopCurrentScanner();

    document.getElementById('instruction').innerText =
      '⏳ Finding your books...';

    sendMyBooks(pupilCode);

    return;
  }


  /* -------------------------
     PUPIL
  ------------------------- */

  if (scanningPupil) {

    pupilCode = decodedText.trim();

    scanningPupil = false;

    stopCurrentScanner();

    document.getElementById('instruction').innerText =
      '📚 Now scan the book';

    scanningBook = true;

    document.getElementById('manualIsbn').style.display =
      'block';

    document.getElementById('isbnInput').value = '';

    setTimeout(function() {

      startScanner();

    }, 500);

    return;
  }


  /* -------------------------
     BOOK
  ------------------------- */

  if (scanningBook) {

    const isbn = decodedText.trim();

    processBook(isbn);

  }

}


/* =================================================
   MANUAL ISBN
================================================= */

function useManualIsbn() {

  if (!scanningBook) {
    return;
  }

  const input =
    document.getElementById('isbnInput');

  let isbn =
    input.value.trim();

  if (!isbn) {

    alert('Please enter the ISBN number.');

    input.focus();

    return;

  }

  /* Remove spaces and hyphens */

  isbn =
    isbn.replace(/[\s-]/g, '');

  processBook(isbn);

}


/* =================================================
   PROCESS BOOK
================================================= */

function processBook(isbn) {

  if (!isbn) {
    return;
  }

  scanningBook = false;

  stopCurrentScanner();

  document.getElementById('manualIsbn').style.display =
    'none';

  document.getElementById('instruction').innerText =
    '⏳ Checking book...';

  sendLoan(action, pupilCode, isbn);

}


/* =================================================
   SEND BORROW / RETURN
================================================= */

function sendLoan(action, pupilCode, isbn) {

  const scriptUrl =
    'https://script.google.com/macros/s/AKfycbzzCXAdTSiYAs6vfZS8d7sHeTtEHfDI4XsM8DAeoQL_5nu9sqcz9Ak-4CICI0QRuHzk4w/exec';

  const callbackName =
    'loanCallback_' + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];

    showResult(result);

  };

  const script =
    document.createElement('script');

  const params =
    new URLSearchParams({

      action: action,
      pupilCode: pupilCode,
      isbn: isbn,
      callback: callbackName

    });

  script.src =
    scriptUrl + '?' + params.toString();

  script.onerror = function() {

    delete window[callbackName];

    showError(
      'I could not connect to the classroom book system.'
    );

  };

  document.body.appendChild(script);

}


/* =================================================
   SEND MY BOOKS REQUEST
================================================= */

function sendMyBooks(pupilCode) {

  const scriptUrl =
    'https://script.google.com/macros/s/AKfycbzzCXAdTSiYAs6vfZS8d7sHeTtEHfDI4XsM8DAeoQL_5nu9sqcz9Ak-4CICI0QRuHzk4w/exec';

  const callbackName =
    'myBooksCallback_' + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];

    showMyBooks(result);

  };

  const script =
    document.createElement('script');

  const params =
    new URLSearchParams({

      action: 'myBooks',
      pupilCode: pupilCode,
      callback: callbackName

    });

  script.src =
    scriptUrl + '?' + params.toString();

  script.onerror = function() {

    delete window[callbackName];

    showError(
      'I could not connect to the classroom book system.'
    );

  };

  document.body.appendChild(script);

}


/* =================================================
   DISPLAY LOAN RESULT
================================================= */

function showResult(result) {

  document.getElementById('scanner').style.display =
    'none';

  const message =
    document.getElementById('message');

  if (result.success) {

    if (result.type === 'borrow') {

      message.innerHTML =

        '<div class="success">' +

        '✅ BOOK BORROWED<br><br>' +

        '<strong>' +

        escapeHtml(result.title) +

        '</strong>' +

        '<br><br>Borrowed by ' +

        escapeHtml(result.pupil) +

        '</div>';

    }

    else {

      message.innerHTML =

        '<div class="success">' +

        '✅ BOOK RETURNED<br><br>' +

        '<strong>' +

        escapeHtml(result.title) +

        '</strong>' +

        '<br><br>Returned by ' +

        escapeHtml(result.pupil) +

        '</div>';

    }

  }

  else {

    message.innerHTML =

      '<div class="warning">' +

      '⚠️ ' +

      escapeHtml(result.message) +

      '<br><br><strong>' +

      escapeHtml(result.title || '') +

      '</strong>' +

      '</div>';

  }

  setTimeout(resetApp, 3000);

}


/* =================================================
   DISPLAY MY BOOKS
================================================= */

function showMyBooks(result) {

  document.getElementById('scanner').style.display =
    'none';

  if (!result.success) {

    showError(result.message);

    return;

  }

  document.getElementById('myBooksScreen').style.display =
    'block';

  document.getElementById('myBooksTitle').innerText =
    '📚 ' + result.pupil + "'s Books";

  const list =
    document.getElementById('bookList');

  if (!result.books || result.books.length === 0) {

    list.innerHTML =

      '<div class="success">' +

      '🎉 You have no books out at the moment!' +

      '</div>';

    return;

  }

  let html =

    '<p><strong>You currently have ' +

    result.books.length +

    (result.books.length === 1
      ? ' book'
      : ' books') +

    ' out.</strong></p>';

  result.books.forEach(function(book) {

    html +=

      '<div class="book">' +

      '<div class="book-title">' +

      '📖 ' +

      escapeHtml(book.title) +

      '</div>' +

      '<div class="book-isbn">' +

      'ISBN: ' +

      escapeHtml(book.isbn) +

      '</div>' +

      '</div>';

  });

  list.innerHTML = html;

}


/* =================================================
   ERRORS
================================================= */

function showError(error) {

  document.getElementById('scanner').style.display =
    'none';

  document.getElementById('myBooksScreen').style.display =
    'none';

  document.getElementById('message').innerHTML =

    '<div class="error">❌ ' +

    escapeHtml(error.message || error) +

    '</div>';

  setTimeout(resetApp, 4000);

}


/* =================================================
   STOP CAMERA
================================================= */

function stopCurrentScanner() {

  if (scanner) {

    try {

      scanner.stop().then(function() {

        scanner.clear();

      }).catch(function() {

        try {
          scanner.clear();
        } catch(e) {}

      });

    }

    catch(e) {}

  }

}


function stopScanner() {

  stopCurrentScanner();

  resetApp();

}


/* =================================================
   RESET
================================================= */

function resetApp() {

  stopCurrentScanner();

  action = null;
  pupilCode = null;

  scanningPupil = false;
  scanningBook = false;
  scanningMyBooks = false;

  document.getElementById('scanner').style.display =
    'none';

  document.getElementById('myBooksScreen').style.display =
    'none';

  document.getElementById('manualIsbn').style.display =
    'none';

  document.getElementById('isbnInput').value =
    '';

  document.getElementById('message').innerHTML =
    '';

  document.getElementById('home').style.display =
    'block';

}


/* =================================================
   HTML SAFETY
================================================= */

function escapeHtml(text) {

  const div =
    document.createElement('div');

  div.textContent =
    text || '';

  return div.innerHTML;

}

</script>

</body>
</html>
